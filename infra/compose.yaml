# Local production-like stack (README §10, ADR-005). Use the npm scripts at the repo root:
#   npm run stack:up | seed | stack:down | stack:reset | stack:logs | test:acceptance | test:e2e
# Only the proxy publishes a port: 127.0.0.1:${PUBLIC_PORT}. Everything comes from ../.env (npm run gen-env):
# secrets, PUBLIC_PORT and the four PUBLIC_*_URL values. Certificates: infra/.certs/ (gen-env, before start).
# Project name: COMPOSE_PROJECT_NAME (default cogniate-stack, set by infra/scripts/lib.sh). Volume names use it.
# All other state is inside the checkout: .env, infra/.certs, infra/.secrets, infra/.logs, infra/.data, .tmp.
name: cogniate-stack

x-public-urls: &public-urls
  PUBLIC_MOODLE_URL: ${PUBLIC_MOODLE_URL:?run npm run gen-env}
  PUBLIC_LTI_URL: ${PUBLIC_LTI_URL:?run npm run gen-env}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:?run npm run gen-env}
  PUBLIC_CONTENT_URL: ${PUBLIC_CONTENT_URL:?run npm run gen-env}

x-node-service: &node-service
  image: node:24.22.0-alpine3.24
  init: true
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # host user (lib.sh), so infra/.logs can stay mode 700
  restart: unless-stopped
  depends_on:
    proxy:
      condition: service_healthy
  # Only the code the service runs. Not the whole repo: .env, infra/.certs (keys) and infra/.secrets stay out.
  volumes:
    - ../package.json:/repo/package.json:ro
    - ../node_modules:/repo/node_modules:ro
    - ../packages:/repo/packages:ro
    - ../services:/repo/services:ro
    - ./.certs/root.crt:/certs/root.crt:ro   # CA certificate only
    - ./.logs:/logs                          # <service>.jsonl (QA hook H7)

networks:
  default:
    ipam:
      config:
        - subnet: ${STACK_SUBNET:-172.28.0.0/16}   # seed cuts only this subnet out of Moodle's blocked hosts

services:
  proxy:
    image: caddy:2.11.7-alpine
    environment:
      <<: *public-urls
      PUBLIC_PORT: ${PUBLIC_PORT:?run npm run gen-env}
    ports:
      - "127.0.0.1:${PUBLIC_PORT:?run npm run gen-env}:${PUBLIC_PORT}"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.certs/stack.crt:/certs/stack.crt:ro   # leaf certificate (SAN = the four names)
      - ./.certs/stack.key:/certs/stack.key:ro   # leaf key; the CA key is never mounted
    networks:
      default:
        aliases:
          - moodle.test
          - lti.cogniate.test
          - app.cogniate.test
          - content.cogniate-content.test
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: ${DB_PASS:?run npm run gen-env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  moodle:
    image: erseco/alpine-moodle:v5.2.4
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *public-urls
      SITE_URL: ${PUBLIC_MOODLE_URL:?run npm run gen-env}
      SSLPROXY: "true"            # TLS ends at the proxy. Moodle builds https URLs and Secure cookies.
      REVERSEPROXY: "false"
      DB_TYPE: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: ${DB_PASS:?run npm run gen-env}
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: ${MOODLE_ADMIN_PASSWORD:?run npm run gen-env}
      MOODLE_EMAIL: admin@example.invalid
      MOODLE_SITENAME: Cogniate_Dev_Moodle
      MOODLE_LANGUAGE: en
      SMTP_HOST: 127.0.0.1        # no mail in dev; seed also sets noemailever=1
      SMTP_PORT: "25"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      DEBUG: "false"
      AUTO_UPDATE_MOODLE: "true"
    volumes:
      - moodledata:/var/www/moodledata
      - ./moodle/php:/opt/cogniate/php:ro            # provisioning PHP CLI scripts
      - ./.certs/root.crt:/certs/root.crt:ro         # CA certificate, copied into moodledata by seed
      - ./.data/fixtures:/opt/cogniate/fixtures:ro   # untrusted course zips (infra/scripts/stage-fixture.sh)
      - ./.data/backups:/opt/cogniate/backups        # .mbz output (infra/scripts/moodle-backup.sh)
    # Port 8080 is NOT published. The proxy reaches it on the compose network.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -H \"Host: $${SITE_URL#https://}\" http://127.0.0.1:8080/login/index.php"]
      interval: 5s
      timeout: 10s
      retries: 48          # about 4 min in total; a first install takes about 30 s (B-T1-02)
      start_period: 20s
    restart: unless-stopped

  lti-service:
    <<: *node-service
    working_dir: /repo/services/lti-service
    command: ["node", "--watch", "src/main.ts"]
    environment:
      PORT: "4100"
      NODE_EXTRA_CA_CERTS: /certs/root.crt
      LTI_MASTER_KEY: ${LTI_MASTER_KEY:?run npm run gen-env}
      LOG_DIR: /logs
      DATA_DIR: /data                          # lti.db (ADR-006); host: infra/.data/lti-service (stack:reset deletes it)
      STACK_PROFILE: ${ACTIVE_STACK_PROFILE:-default}   # set by infra/scripts/lib.sh from the saved profile
      # Hosts that may resolve to private addresses (security §9). The acceptance profile adds ",qa-platform.test,evil.test"
      # (ACCEPTANCE_ALLOWLIST_EXTRA, set by infra/scripts/lib.sh from the saved stack profile).
      OUTBOUND_PRIVATE_HOST_ALLOWLIST: moodle.test${ACCEPTANCE_ALLOWLIST_EXTRA:-}
      <<: *public-urls
    volumes:
      - ../package.json:/repo/package.json:ro
      - ../node_modules:/repo/node_modules:ro
      - ../packages:/repo/packages:ro
      - ../services:/repo/services:ro
      - ./.certs/root.crt:/certs/root.crt:ro
      - ./.logs:/logs
      - ./.data/lti-service:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4100/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

  cogniate-app:
    <<: *node-service
    working_dir: /repo/services/cogniate-app
    command: ["node", "--watch", "src/main.ts"]
    environment:
      PORT: "4200"
      CONTENT_PORT: "4201"
      NODE_EXTRA_CA_CERTS: /certs/root.crt
      APP_MASTER_KEY: ${APP_MASTER_KEY:?run npm run gen-env}
      LOG_DIR: /logs
      DATA_DIR: /data                          # cogniate.db, packages/, uploads/ (ADR-006); host: infra/.data/cogniate-app
      STACK_PROFILE: ${ACTIVE_STACK_PROFILE:-default}   # set by infra/scripts/lib.sh from the saved profile
      # Security §9: the app may call the LTI service host (private address behind the proxy); acceptance adds QA hosts.
      # T8 (course shell): the app also calls Moodle web services on the local Moodle host.
      OUTBOUND_PRIVATE_HOST_ALLOWLIST: lti.cogniate.test,moodle.test${ACCEPTANCE_ALLOWLIST_EXTRA:-}
      # T4b1: the LTI service API key of the tool account "cogniate", read at each use (app contract §1).
      LTI_API_KEY_FILE: /run/secrets/app/lti-api-key
      <<: *public-urls
    volumes:
      - ../package.json:/repo/package.json:ro
      - ../node_modules:/repo/node_modules:ro
      - ../packages:/repo/packages:ro
      - ../services:/repo/services:ro
      - ../apps:/repo/apps:ro                  # Player and portal builds served on their public origins.
      - ./.certs/root.crt:/certs/root.crt:ro
      - ./.logs:/logs
      - ./.data/cogniate-app:/data
      # T8 Build Runner queue (host-side runner, infra/scripts/build-runner.sh). NO Docker socket in this container:
      # the app may only WRITE build requests; status and .mbz files are read-only for it.
      - ./.data/build-queue/requests:/build-queue/requests
      - ./.data/build-queue/status:/build-queue/status:ro
      - ./.data/build-queue/out:/build-queue/out:ro
      # Least privilege: only the app's own key, read-only. A folder that holds only that file (lti-bootstrap.sh keeps the
      # copy), not the file itself: a bind mount of a missing file makes a folder, and a replaced file (key rotation)
      # would not be seen. seed.json and the other keys stay out of this container.
      - ./.secrets/app:/run/secrets/app:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4200/healthz && wget -q -O /dev/null http://127.0.0.1:4201/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

  # ---- Acceptance profile only (T2b, local-stack §3). Start: STACK_PROFILE=acceptance npm run stack:up.
  # Test helper hosts with their own network alias and their own leaf certificate (qa.crt), so the proxy and the
  # T1 leaf do not change. Code: infra/qa-hosts/qa-hosts.mjs. Health checks use plain HTTP :8080 (never logged as hits).
  sink:
    image: node:24.22.0-alpine3.24
    profiles: ["acceptance"]
    init: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0   # :443 as the host user
    working_dir: /qa-hosts
    command: ["node", "qa-hosts.mjs", "--mode=sink", "--name=sink"]
    environment:
      LOG_DIR: /logs                           # sink_hit {host, method, path} -> infra/.logs/sink.jsonl
    volumes:
      - ./qa-hosts:/qa-hosts:ro
      - ./.certs/qa.crt:/certs/qa.crt:ro
      - ./.certs/qa.key:/certs/qa.key:ro
      - ./.logs:/logs
    networks:
      default:
        aliases:
          - evil.test
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 3s

  qa-platform:
    image: node:24.22.0-alpine3.24
    profiles: ["acceptance"]
    init: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    working_dir: /qa-hosts
    command: ["node", "qa-hosts.mjs", "--mode=static", "--name=qa-platform", "--root=/fixtures"]
    environment:
      LOG_DIR: /logs                           # qa_platform_hit {method, path, status} -> infra/.logs/qa-platform.jsonl
    volumes:
      - ./qa-hosts:/qa-hosts:ro
      - ./.certs/qa.crt:/certs/qa.crt:ro
      - ./.certs/qa.key:/certs/qa.key:ro
      - ./.logs:/logs
      # QA writes its JWKS here at run time (git-ignored by QA). QA_PLATFORM_DIR: another folder, relative to infra/.
      - ${QA_PLATFORM_DIR:-../tests/fixtures/qa-platform}:/fixtures:ro
    networks:
      default:
        aliases:
          - qa-platform.test
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 3s

  # Independent Python SDK client (T3c). QA owns the read-only runner; no SDK source is used in the product.
  compat:
    profiles: ["compat"]
    build: ./compat
    image: ${COMPOSE_PROJECT_NAME:-cogniate-stack}-compat:0.0.4
    init: true
    environment:
      <<: *public-urls
      REQUESTS_CA_BUNDLE: /certs/root.crt
      LTI_API_KEY_FILE: /run/secrets/lti-api-key.cogniate
    volumes:
      - type: bind
        source: ${COMPAT_TESTS_DIR:-../tests/compat}
        target: /tests/compat
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.certs/root.crt
        target: /certs/root.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/lti-api-key.cogniate
        target: /run/secrets/lti-api-key.cogniate
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      proxy:
        condition: service_healthy

  # QA runner. Not started by stack:up. Use npm run test:acceptance / test:e2e (infra/scripts/e2e-run.sh).
  e2e:
    profiles: ["test"]
    build: ./e2e
    image: ${COMPOSE_PROJECT_NAME:-cogniate-stack}-e2e:1.56.0   # one image per project (Q-T1-03)
    working_dir: /repo
    entrypoint: ["/bin/sh", "/repo/infra/e2e/entrypoint.sh"]
    environment:
      <<: *public-urls
      NODE_EXTRA_CA_CERTS: /certs/root.crt    # Node side (Playwright request fixture, test code)
      CI: "1"
    shm_size: "1gb"
    depends_on:
      proxy:
        condition: service_healthy
    # A-T1-03, H8: the repo is READ-ONLY. On top of it:
    #  - /repo/.env is the public part of .env only (.tmp/public.env): no secret is visible.
    #  - infra/.certs is .tmp/public-certs: a copy of the PUBLIC certificates only (no ca.key, no stack.key), read-only.
    #  - infra/.secrets and infra/.logs are read-only.
    #  - writable: only QA's output folders (git-ignored in tests/.gitignore) and the tests/node_modules volume.
    #    infra/scripts/qa-suite.sh and e2e-run.sh create these folders before the run.
    volumes:
      - ..:/repo:ro
      - ../.tmp/public.env:/repo/.env:ro
      - ../.tmp/public-certs:/repo/infra/.certs:ro
      - ./.certs/root.crt:/certs/root.crt:ro
      - ./.secrets:/repo/infra/.secrets:ro
      - ./.logs:/repo/infra/.logs:ro
      - ../tests/acceptance/artifacts:/repo/tests/acceptance/artifacts
      - ../tests/e2e/artifacts:/repo/tests/e2e/artifacts
      - ../tests/test-results:/repo/tests/test-results
      - ../tests/playwright-report:/repo/tests/playwright-report
      - ../tests/.tmp:/repo/tests/.tmp
      # T2b: QA writes the qa-platform.test files (its JWKS) here; the qa-platform service serves them.
      - ${QA_PLATFORM_DIR:-../tests/fixtures/qa-platform}:/repo/tests/fixtures/qa-platform
      # Linux install of the QA project (npm ci --prefix tests). A volume, so it never replaces the host's
      # tests/node_modules (macOS native binaries of esbuild/rollup).
      - e2e_tests_node_modules:/repo/tests/node_modules

volumes:
  e2e_tests_node_modules:
  pgdata:
  moodledata:
