# T8 Build Runner project (cogniate-build-<id>): a throwaway Moodle that turns one SCORM course version into a .mbz.
# Started and removed by infra/scripts/build-runner.sh (host side). Isolation (ADR-007, AC-T8-03):
#  - ONE network, internal: no internet, no DNS for the main stack (moodle.test), no published port;
#  - own Postgres and own volumes (removed with `down -v`);
#  - the package zip and the job file are read-only; there is NO writable host folder (A-T8-01): the runner takes
#    the .mbz out with `docker cp` (which never follows a symlink) and checks it before it reaches out/.
# Owner label (stack-scoped sweep): several stacks can run on one Docker host (other checkouts, QA runs). Every
# container, volume and network has org.cogniate.stack=<COMPOSE_PROJECT_NAME of the owning stack>; a runner removes
# leftovers of its OWN stack only.
x-owner: &owner
  org.cogniate.stack: ${BUILD_STACK:-unknown}

services:
  db:
    image: postgres:16-alpine
    labels: *owner
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: ${BUILD_DB_PASS:?set by build-runner.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [build]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 2s
      timeout: 5s
      retries: 60

  moodle:
    # erseco/alpine-moodle:v5.2.4 + composer dependencies (infra/build-runner/Dockerfile): no download at start.
    image: cogniate-build-moodle:v5.2.4
    labels: *owner
    depends_on:
      db:
        condition: service_healthy
    environment:
      SITE_URL: http://cogniate-build.invalid
      REVERSEPROXY: "false"
      SSLPROXY: "false"
      DB_TYPE: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: ${BUILD_DB_PASS:?set by build-runner.sh}
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: ${BUILD_ADMIN_PASS:?set by build-runner.sh}
      MOODLE_EMAIL: admin@example.invalid
      MOODLE_SITENAME: Cogniate_Build
      MOODLE_LANGUAGE: en
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "25"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      DEBUG: "false"
      AUTO_UPDATE_MOODLE: "true"
      SYNC_MOODLE_CODE: never          # the image code is complete (vendor included)
    volumes:
      - moodledata:/var/www/moodledata
      - ./php:/opt/cogniate/php:ro
      - ${BUILD_IN:?set by build-runner.sh}:/opt/cogniate/in:ro
    networks: [build]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -H 'Host: cogniate-build.invalid' http://127.0.0.1:8080/login/index.php"]
      interval: 3s
      timeout: 10s
      retries: 100
      start_period: 10s

networks:
  build:
    internal: true
    labels: *owner

volumes:
  pgdata:
    labels: *owner
  moodledata:
    labels: *owner
