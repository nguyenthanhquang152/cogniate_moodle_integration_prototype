    --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--font); }
  a { color: var(--primary); }
  code { font: .86em var(--mono); background: var(--secondary); border-radius: .35rem; padding: .05em .35em; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  .side { background: var(--side-bg); border-right: 1px solid var(--side-border); padding: 22px 14px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; }
  .logo { font-weight: 700; font-size: 1.25rem; padding: 0 10px 18px; }
  .logo span { background: var(--grad-logo); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .nav { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: .6rem; padding: 9px 12px; color: hsl(0 0% 85%); cursor: pointer; }
  .nav:hover { background: hsl(240 15% 12%); }
  .nav[aria-selected="true"] { background: var(--nav-active); color: #fff; }
  .nav .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; background: var(--secondary); color: var(--muted-fg); }
  .nav[aria-selected="true"] .n { background: var(--primary); color: #fff; }
  .stamp { margin-top: auto; font-size: .78rem; color: var(--muted-fg); padding: 0 10px; }

  main { padding: 28px 36px 60px; max-width: 1180px; width: 100%; min-width: 0; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; }
  .top h1 { margin: 0; font-size: 1.7rem; letter-spacing: -.01em; }
  .top p { margin: 4px 0 0; color: var(--muted-fg); }
  .draft { flex: none; border: 1px solid var(--warn); color: var(--warn); border-radius: 999px; padding: 4px 12px; font-size: .82rem; white-space: nowrap; }

  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow-card); }
  .card h2 { margin: 0 0 10px; font-size: 1.12rem; }
  .card h3 { margin: 0 0 6px; font-size: 1rem; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .stack { display: grid; gap: 16px; }
  .muted { color: var(--muted-fg); }
  .hero { background: var(--grad-primary); }

  .btn { border: 1px solid var(--card-border); background: var(--secondary); border-radius: 999px; padding: 7px 16px; cursor: pointer; }
  .btn:hover { border-color: var(--primary); }
  .btn.main { background: var(--grad-button); border: 0; box-shadow: var(--shadow-button); color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .45; cursor: default; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .pill { border: 1px solid var(--card-border); background: transparent; border-radius: 999px; padding: 6px 14px; cursor: pointer; color: hsl(0 0% 85%); }
  .pill[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 600; border: 1px solid; white-space: nowrap; }
  .b-ok { color: var(--ok); border-color: var(--ok); }
  .b-warn { color: var(--warn); border-color: var(--warn); }
  .b-plan { color: var(--primary); border-color: var(--primary-muted); }
  .b-bad { color: hsl(0 80% 66%); border-color: var(--bad); }
  .proof { margin: 12px 0 0; font-size: .9rem; color: var(--muted-fg); }
  .chip { display: inline-block; background: var(--secondary); border-radius: 999px; padding: 2px 10px; font-size: .85rem; margin: 0 6px 6px 0; }

  /* Start */
  .path { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .path li { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 12px; align-items: center; background: var(--secondary); border-radius: .6rem; padding: 10px 12px; }
  .path .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--grad-button); font-weight: 700; }
  .path .time { color: var(--muted-fg); font-size: .9rem; }

  /* Story stepper */
  .stepper { display: flex; align-items: center; margin: 4px 0 18px; }
  .stepper .dot { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--card-border); background: var(--card); cursor: pointer; font-weight: 700; }
  .stepper .dot[aria-current="step"] { background: var(--grad-button); border-color: transparent; box-shadow: var(--shadow-button); }
  .stepper .line { flex: 1; height: 2px; background: var(--card-border); }
  .stepper .lab { display: block; font-size: .78rem; color: var(--muted-fg); margin-top: 6px; text-align: center; }
  .stepper .cell { display: flex; flex-direction: column; align-items: center; width: 92px; }

  /* Flows */
  .diagram { overflow-x: auto; }
  .diagram svg { display: block; width: 100%; min-width: 560px; height: auto; margin: 0 auto; }
  .detailrow { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; border-top: 1px solid var(--card-border); margin-top: 14px; padding-top: 14px; }
  .detail { display: grid; grid-template-columns: 30px 1fr; gap: 12px; flex: 1; min-width: 280px; }

  .detail .who { font-size: .85rem; color: var(--muted-fg); }
  .detail p { margin: 4px 0 0; }

  svg .life { stroke: var(--card-border); stroke-dasharray: 4 5; }
  svg .step { cursor: pointer; }
  svg .step line, svg .step path { stroke: hsl(0 0% 60%); stroke-width: 1.6; fill: none; }
  svg .step.reply line { stroke-dasharray: 6 4; }
  svg .step text { fill: hsl(0 0% 82%); font: 13px var(--font); }
  svg .step circle { fill: var(--secondary); stroke: var(--card-border); }
  svg .step .no { fill: var(--fg); font: 700 11px var(--font); }
  svg .step.on line, svg .step.on path { stroke: var(--primary); stroke-width: 2.4; }
  svg .step.on text { fill: #fff; font-weight: 700; }
  svg .step.on circle { fill: var(--primary); stroke: var(--primary); }
  svg .hit { stroke: transparent !important; stroke-width: 22 !important; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
  .steps button { display: grid; grid-template-columns: 26px 1fr; gap: 10px; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: .6rem; padding: 8px 10px; cursor: pointer; }
  .steps button:hover { background: var(--secondary); }
  .steps button[aria-current="step"] { background: var(--secondary); border-color: var(--primary-muted); }
  .steps .sn { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 700; background: var(--muted); }
  .steps button[aria-current="step"] .sn { background: var(--primary); }
  .steps .who { font-size: .8rem; color: var(--muted-fg); }
  .steps .det { display: block; margin-top: 2px; color: hsl(0 0% 80%); font-size: .9rem; }

  /* Proven */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }

  .tile b { display: block; font-size: 1.6rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--card-border); }
  th { font-size: .82rem; color: var(--muted-fg); font-weight: 600; }

  /* Decisions */

  .dec { display: grid; gap: 10px; }
  .dec .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .85rem; color: var(--muted-fg); }
  .dec .id { font-weight: 700; color: var(--fg); background: var(--secondary); border-radius: .4rem; padding: 1px 8px; }
  .dec .q { font-weight: 600; margin: 0; }
  .rec { border-left: 3px solid var(--primary); background: hsl(270 30% 12%); border-radius: 0 .5rem .5rem 0; padding: 8px 12px; margin: 0; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choices label { border: 1px solid var(--card-border); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: .9rem; }
  .choices input { accent-color: var(--primary); margin: 0 6px 0 0; }
  .choices label:has(input:checked) { border-color: var(--primary); background: hsl(270 30% 16%); }
  textarea, input[type="text"] { width: 100%; background: var(--input); border: 1px solid var(--card-border); border-radius: .5rem; padding: 8px 10px; }
  textarea { min-height: 54px; resize: vertical; }
  .bar { position: sticky; bottom: 0; margin-top: 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--side-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 12px 16px; }
  #copyOut { margin-top: 10px; min-height: 180px; font: .85rem var(--mono); }

  [hidden] { display: none !important; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 10px; }
    .logo { padding: 6px 10px; width: 100%; }
    #nav { display: flex; flex-wrap: wrap; gap: 4px; }
    .nav { width: auto; }
    .stamp { width: 100%; margin-top: 6px; }
    main { padding: 18px; }
    .top { flex-wrap: wrap; }
    .grid2, .steps, .tiles { grid-template-columns: 1fr; }
    .stepper .cell { width: 64px; }
  }

<script>
(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('pack-data').textContent);
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const KEY = 'cogniate-pack-answers:' + D.meta.source;
  const STATUS = {
    qa: ['Proven by QA', 'b-ok'],
    author: ['Not verified by QA', 'b-bad'],
    planned: ['Planned, not tested yet', 'b-plan'],
    pending: ['Pending final QA', 'b-warn'],
    not: ['Not proven', 'b-bad'],
  };
  const TABS = [['start', 'Start'], ['story', 'Story'], ['flows', 'Flows'], ['proven', 'Proven'], ['decisions', 'Decisions']];
  const state = { tab: 'start', story: 0, flow: D.flows[0].id, step: 0, filter: 'all', timer: null };

  // ---------- helpers ----------
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else if (v !== false && v != null) e.setAttribute(k, v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return e;
  }
  function s(tag, attrs, ...kids) {
    const e = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
    for (const kid of kids.flat()) e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    return e;
  }
  const badge = (st) => h('span', { class: 'badge ' + STATUS[st][1] }, STATUS[st][0]);
  const idList = (ids) => ids.map((id, i) => [i ? ', ' : '', h('code', {}, id)]);
  function proofLine(p) {

      p.status === 'planned' ? ['Planned proof: ', idList(p.ids), '. Result: after T7.']

  }
  const flowById = (id) => D.flows.find((f) => f.id === id) || D.flows[0];
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

  // ---------- frame ----------
  document.title = D.meta.title + ': explainer';
  document.getElementById('title').textContent = D.meta.title;
  document.getElementById('subtitle').textContent = D.meta.subtitle;
  document.getElementById('draft').textContent = D.meta.draft;
  document.getElementById('stamp').textContent = 'Source: commit ' + D.meta.source + ', ' + D.meta.date + '. Content comes from the repo docs.';
  const nav = document.getElementById('nav');
  TABS.forEach(([id, label], i) => nav.append(
    h('button', { class: 'nav', role: 'tab', id: 'nav-' + id, 'aria-controls': 'tab-' + id, onclick: () => go(id) },
      h('span', { class: 'n' }, i + 1), label)));

  // ---------- routing (#tab/a/b) ----------
  // Route at once (no wait for the async hashchange event). Back and Forward still work.
  function go(...parts) {
    const hash = '#' + parts.filter((p) => p != null && p !== '').join('/');
    if (hash !== location.hash) history.pushState(null, '', hash);
    route();
  }
  function route() {
    const [tab, a, b] = decodeURIComponent(location.hash.slice(1)).split('/');
    state.tab = TABS.some(([id]) => id === tab) ? tab : 'start';
    if (state.tab === 'story') state.story = clamp((parseInt(a, 10) || 1) - 1, 0, D.story.length - 1);
    if (state.tab === 'flows') {
      const f = flowById(a);
      if (f.id !== state.flow) { state.flow = f.id; drawFlow(); }
      state.step = clamp((parseInt(b, 10) || 1) - 1, 0, f.steps.length - 1);
    } else stopPlay();
    for (const [id] of TABS) {
      document.getElementById('tab-' + id).hidden = id !== state.tab;
      document.getElementById('nav-' + id).setAttribute('aria-selected', String(id === state.tab));
    }
    if (state.tab === 'story') updateStory();
    if (state.tab === 'flows') updateFlowStep();
  }
  window.addEventListener('hashchange', route);
  window.addEventListener('popstate', route);
  document.addEventListener('keydown', (ev) => {

    if (state.tab === 'flows') { ev.preventDefault(); stopPlay(); go('flows', state.flow, clamp(state.step + d, 0, flowById(state.flow).steps.length - 1) + 1); }
  });

  // ---------- Start ----------
  (function renderStart() {
    const el = document.getElementById('tab-start');

      h('span', { class: 'num' }, i + 1),

    el.append(h('div', { class: 'stack' },
      h('div', { class: 'card hero' }, h('h2', {}, 'What this is'), D.start.intro.map((t) => h('p', {}, t))),
      h('div', { class: 'grid2' },
        h('div', { class: 'card' }, h('h2', {}, 'Your 30-minute path'), path),
        h('div', { class: 'stack' },
          h('div', { class: 'card' }, h('h2', {}, 'How to use this page'), h('ul', {}, D.start.howTo.map((t) => h('li', {}, t)))),
          h('div', { class: 'card' }, h('h2', {}, 'Status'), h('p', {}, D.meta.resultsNote)))),

  })();

  // ---------- Story ----------
  const storyEl = document.getElementById('tab-story');

      h('span', { class: 'lab' }, st.title)));
  });
  const storyCard = h('div', { class: 'card' });
  const prevS = h('button', { class: 'btn', onclick: () => go('story', state.story) }, '← Previous');
  const nextS = h('button', { class: 'btn main', onclick: () => go('story', state.story + 2) }, 'Next →');
  storyEl.append(h('div', { class: 'card hero', style: 'margin-bottom:16px' },
    h('h2', {}, 'The story in five steps'), h('p', { class: 'muted' }, D.meta.storyNote), stepper),
    storyCard, h('div', { class: 'row', style: 'margin-top:14px' }, prevS, nextS),
    D.built ? h('div', { class: 'card', style: 'margin-top:22px', id: 'built' }, h('h2', {}, 'How this was built'),
      D.built.map((x) => h('div', { style: 'margin-top:10px' }, h('h3', {}, x.title), h('p', { style: 'margin:0' }, x.text),
        x.links.length ? h('p', { class: 'proof', style: 'margin-top:4px' }, x.links.map(([label, href], i) => [i ? ' · ' : '', h('a', { href }, label)])) : null))) : null);
  function updateStory() {
    const st = D.story[state.story];
    stepper.querySelectorAll('.dot').forEach((b, i) => { if (i === state.story) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
    storyCard.replaceChildren(...[
      h('h2', {}, (state.story + 1) + '. ' + st.title),
      h('div', {}, st.who.map((w) => h('span', { class: 'chip' }, w))),
      h('p', { class: 'muted' }, 'Where: ' + st.where),
      st.text.map((t) => h('p', {}, t)),
      h('div', { class: 'row' }, st.flows.map((id) => h('button', { class: 'btn', onclick: () => go('flows', id, 1) }, 'See the flow: ' + flowById(id).title))),
      proofLine(st.proof)].flat());
    prevS.disabled = state.story === 0;
    nextS.disabled = state.story === D.story.length - 1;
  }

  // ---------- Flows ----------
  const flowsEl = document.getElementById('tab-flows');
  const flowPills = h('div', { class: 'pills', role: 'group', 'aria-label': 'Flows' },
    D.flows.map((f) => h('button', { class: 'pill', 'data-flow': f.id, onclick: () => { stopPlay(); go('flows', f.id, 1); } }, f.title)));
  const flowHead = h('div', { class: 'card hero', style: 'margin-bottom:16px' });
  const diagram = h('div', { class: 'diagram' });
  const detail = h('div', { class: 'detail', 'aria-live': 'polite' });
  const stepsList = h('ol', { class: 'steps' });
  const playBtn = h('button', { class: 'btn main', onclick: togglePlay }, 'Play');
  const prevF = h('button', { class: 'btn', onclick: () => { stopPlay(); go('flows', state.flow, state.step); } }, '← Back');
  const nextF = h('button', { class: 'btn', onclick: () => { stopPlay(); go('flows', state.flow, state.step + 2); } }, 'Next →');
  flowsEl.append(flowPills, flowHead,
    h('div', { class: 'card' }, diagram, h('div', { class: 'detailrow' }, detail, h('div', { class: 'row' }, prevF, playBtn, nextF))),
    h('div', { class: 'card', style: 'margin-top:16px' }, h('h2', {}, 'All steps'), stepsList));

  function drawFlow() {
    const f = flowById(state.flow);
    flowPills.querySelectorAll('.pill').forEach((p) => p.setAttribute('aria-pressed', String(p.dataset.flow === f.id)));
    flowHead.replaceChildren(h('h2', {}, f.title), h('p', {}, f.summary), proofLine(f.proof),
      h('p', { class: 'proof' }, 'Full technical diagram: ', h('a', { href: '../architecture/flows.md' }, 'docs/architecture/flows.md'), ', section ' + f.ref + '.'));
    diagram.replaceChildren(seqSvg(f));
    stepsList.replaceChildren(...f.steps.map((st, i) => h('li', {},
      h('button', { 'data-i': i, onclick: () => { stopPlay(); go('flows', f.id, i + 1); } },

        h('span', {}, h('strong', {}, st.label), h('span', { class: 'who' }, ' · ' + who(st)),

  }
  const who = (st) => D.actors[st.from].name + (st.from === st.to ? '' : ' → ' + D.actors[st.to].name);
  function updateFlowStep() {
    const f = flowById(state.flow);
    flowPills.querySelectorAll('.pill').forEach((p) => p.setAttribute('aria-pressed', String(p.dataset.flow === f.id)));
    diagram.querySelectorAll('.step').forEach((g) => {

    nextF.disabled = state.step === f.steps.length - 1;
  }
  function seqSvg(f) {
    const colW = 190, padX = 16, top = 12, headH = 44, rowH = 52;
    const n = f.actors.length;
    const offset = (colW * Math.max(n, 3) - colW * n) / 2;
    // Room for self-arrow labels on the last column.
    const last = f.actors[n - 1];
    const selfLabels = f.steps.filter((st) => st.from === last && st.to === last).map((st) => st.label.length);
    const extraRight = selfLabels.length && offset === 0 ? Math.max(0, 50 + Math.max(...selfLabels) * 7.2 - colW / 2) : 0;
    const W = padX * 2 + colW * Math.max(n, 3) + extraRight;
    const x = (key) => padX + offset + colW * f.actors.indexOf(key) + colW / 2;
    const firstY = top + headH + 34;

      s('marker', { id: 'ah', viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' },

      s('marker', { id: 'ahOn', viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' },

    for (const key of f.actors) {
      const a = D.actors[key];
      svg.append(s('line', { class: 'life', x1: x(key), y1: top + headH, x2: x(key), y2: H - 8 }));
      svg.append(s('g', { class: 'head ' + a.kind },
        s('rect', { x: x(key) - 80, y: top, width: 160, height: headH, rx: 10 }),
        s('text', { x: x(key), y: top + headH / 2 + 4.5, 'text-anchor': 'middle' }, a.name)));
    }
    f.steps.forEach((st, i) => {
      const y = firstY + i * rowH;
      const g = s('g', { class: 'step' + (st.reply ? ' reply' : ''), 'data-i': i });
      g.append(s('title', {}, (i + 1) + '. ' + st.label + ': ' + st.detail));
      g.addEventListener('click', () => { stopPlay(); go('flows', f.id, i + 1); });
      const x1 = x(st.from);
      if (st.from === st.to) {
        const d = `M${x1 + 4},${y - 10} h34 v20 h-30`;
        g.append(s('path', { class: 'hit', d }), s('path', { d, 'marker-end': 'url(#ah)' }));
        g.append(s('circle', { cx: x1 - 16, cy: y, r: 10 }), s('text', { class: 'no', x: x1 - 16, y: y + 4, 'text-anchor': 'middle' }, i + 1));
        g.append(s('text', { x: x1 + 46, y: y + 4 }, st.label));
      } else {
        const x2 = x(st.to), dir = x2 > x1 ? 1 : -1;
        const lx1 = x1 + dir * 28, lx2 = x2 - dir * 3;
        g.append(s('line', { class: 'hit', x1: lx1, y1: y, x2: lx2, y2: y }), s('line', { x1: lx1, y1: y, x2: lx2, y2: y, 'marker-end': 'url(#ah)' }));
        g.append(s('circle', { cx: x1 + dir * 15, cy: y, r: 10 }), s('text', { class: 'no', x: x1 + dir * 15, y: y + 4, 'text-anchor': 'middle' }, i + 1));
        g.append(s('text', { x: (lx1 + lx2) / 2, y: y - 8, 'text-anchor': 'middle' }, st.label));
      }
      svg.append(g);
    });
    return svg;

  // ---------- Proven ----------

      tbody.replaceChildren(...rows.map((r) => h('tr', {},
        h('td', {}, r.claim), h('td', {}, badge(r.status)),
        h('td', {}, idList(r.ids), r.evidence ? [h('br'), h('span', { class: 'muted' }, r.evidence)] : null))));
      note.textContent = state.filter === 'all' ? 'Showing all ' + rows.length + ' rows. Click a box to filter.' : 'Showing ' + rows.length + ' rows. Click the box again to show all.';
    }
    for (const st of order) {
      const count = D.proven.filter((r) => r.status === st).length;
      tiles.append(h('button', { class: 'tile', 'data-st': st, onclick: () => { state.filter = state.filter === st ? 'all' : st; draw(); } },
        h('b', {}, count), badge(st)));
    }
    el.append(h('div', { class: 'card hero', style: 'margin-bottom:16px' }, h('h2', {}, 'Proven / not proven'),
      h('p', {}, 'Each row is one claim. “Proven by QA” means that an independent QA test passed. “Pending final QA” means that required verification is incomplete. A row can need a repair or rerun.'),
      h('p', { class: 'muted' }, D.meta.resultsNote)),
      tiles, note,
      h('div', { class: 'card' }, h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Claim'), h('th', {}, 'Status'), h('th', {}, 'Proof'))), tbody)));
    draw();
  })();

  // ---------- Decisions ----------
  (function renderDecisions() {
    const el = document.getElementById('tab-decisions');
    let store = { name: '', a: {} };
    try { store = Object.assign(store, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { /* storage blocked: answers stay in memory */ }
    const CHOICES = [['accept', 'Accept our recommendation'], ['change', 'Change it'], ['unsure', 'Not sure, let us talk']];
    const count = h('span', { class: 'muted' });
    const msg = h('span', { class: 'muted', role: 'status' });
    const out = h('textarea', { id: 'copyOut', readonly: true, hidden: true, 'aria-label': 'Your answers as text' });
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* ignore */ }
      const done = D.decisions.filter((d) => store.a[d.id] && store.a[d.id].choice).length;
      count.textContent = done + ' of ' + D.decisions.length + ' answered';
    }
    const name = h('input', { type: 'text', id: 'yourName', value: store.name, placeholder: 'Your name', oninput: (e) => { store.name = e.target.value; save(); } });
    el.append(h('div', { class: 'card hero' }, h('h2', {}, 'Decisions needed'),
      h('p', {}, 'Only a human can answer these questions. Each question has our recommendation. The prototype uses the recommendation until you decide.'),
      h('p', { class: 'muted' }, 'The same list as decisions-needed.md (from docs/architecture/open-questions.md). The groups are a proposal by Docs.'),
      h('label', { for: 'yourName' }, 'Your name'), name));
    for (const g of D.decisionGroups) {
      const items = D.decisions.filter((d) => d.group === g.id);
      el.append(h('h2', { class: 'dgroup' }, g.title + ' (' + items.length + ')'));
      const list = h('div', { class: 'stack' });
      for (const d of items) {
        const cur = store.a[d.id] || {};
        list.append(h('article', { class: 'card dec', id: 'dec-' + d.id },
          h('div', { class: 'meta' }, h('span', { class: 'id' }, d.id), d.area, ' · Who decides: ' + d.who),
          h('p', { class: 'q' }, d.question),
          h('p', { class: 'rec' }, h('strong', {}, 'Our recommendation: '), d.recommendation),
          h('p', { class: 'muted', style: 'margin:0' }, 'It blocks: ' + d.blocks),
          h('div', { class: 'choices', role: 'radiogroup', 'aria-label': 'Your answer to ' + d.id },
            CHOICES.map(([v, label]) => h('label', {},
              h('input', { type: 'radio', name: 'c-' + d.id, value: v, checked: cur.choice === v,
                onchange: () => { store.a[d.id] = Object.assign(store.a[d.id] || {}, { choice: v }); save(); } }), label))),
          h('textarea', { 'aria-label': 'Note for ' + d.id, placeholder: 'Your answer or note (optional)',
            oninput: (e) => { store.a[d.id] = Object.assign(store.a[d.id] || {}, { note: e.target.value }); save(); } }, cur.note || '')));
      }
      el.append(list);
    }
    function answersText() {
      const lines = ['Cogniate × Moodle prototype: answers to "Decisions needed"',
        'From: ' + (store.name.trim() || '(no name)'),
        'Date: ' + new Date().toISOString().slice(0, 10),
        'Pack: commit ' + D.meta.source + ' (' + D.meta.date + ')', ''];
      const open = [];
      for (const g of D.decisionGroups) {
        lines.push('[' + g.title + ']');
        for (const d of D.decisions.filter((x) => x.group === g.id)) {
          const a = store.a[d.id] || {};
          const note = (a.note || '').trim();
          if (!a.choice && !note) { open.push(d.id); continue; }
          const label = { accept: 'ACCEPT our recommendation', change: 'CHANGE', unsure: 'NOT SURE, let us talk' }[a.choice] || 'NO CHOICE';
          lines.push(d.id + ' (' + d.area + '): ' + label + (note ? '. Note: ' + note.replace(/\s+/g, ' ') : ''));
        }
        lines.push('');
      }
      lines.push('Not answered: ' + (open.length ? open.join(', ') : 'none'));
      return lines.join('\n');
    }
    async function copy() {
      const text = answersText();
      out.value = text;
      out.hidden = false;
      let ok = false;
      try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
        out.select();
        try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      }
      msg.textContent = ok ? 'Copied. Paste the text in a message to the Lead.' : 'This browser blocks copy. Select the text below and copy it.';
    }
    function clearAll() {
      if (!confirm('Delete all your answers on this page?')) return;
      store = { name: '', a: {} };
      save();
      location.reload();
    }
    el.append(h('div', { class: 'bar' },
      h('button', { class: 'btn main', id: 'copyBtn', onclick: copy }, 'Copy my answers'),
      h('button', { class: 'btn', onclick: clearAll }, 'Clear'), count, msg), out);
    save();
  })();

  drawFlow();
  route();
})();
</script>
</body>
</html>
