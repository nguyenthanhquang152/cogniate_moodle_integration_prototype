<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explainer video slide</title>
<!-- One slide per page load: slides.html?i=<index>&lang=en|vi. render.cjs injects window.SCRIPT (script.json). -->
<style>
  :root {
    --bg: hsl(252 20% 5%); --fg: hsl(0 0% 98%); --card: #16161d; --border: hsl(240 15% 20%);
    --primary: hsl(270 70% 65%); --muted: hsl(0 0% 70%); --radius: .75rem;
    --ok: hsl(140 50% 45%); --warn: hsl(35 70% 55%); --bad: hsl(0 72% 51%);
    --grad-button: linear-gradient(to right, #b78bf9, #7444bb);
    --grad-primary: linear-gradient(135deg, hsl(240 26% 14%) 0%, hsl(258 27% 26%) 35%, hsl(240 29% 20%) 100%);
    --grad-logo: linear-gradient(to right, #f5db92, #b88bf8);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--grad-primary); color: var(--fg);
    font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", sans-serif; }
  .top { position: absolute; left: 40px; right: 40px; top: 22px; display: flex; justify-content: space-between; font-size: 18px; color: var(--muted); }
  .logo span { background: var(--grad-logo); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; }
  #stamp { font-size: 14px; color: hsl(0 0% 55%); margin-left: 10px; }
  .notice { color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: 2px 12px; font-size: 15px; }
  h1 { position: absolute; left: 40px; top: 58px; font-size: 40px; letter-spacing: -.01em; }
  .stage { position: absolute; left: 40px; right: 40px; top: 122px; height: 430px; display: flex; align-items: center; justify-content: center; }
  .caption { position: absolute; left: 40px; right: 40px; bottom: 22px; min-height: 120px; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.5); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 24px; font-size: 23px; line-height: 1.38; text-align: center; }
  .title-slide { flex-direction: column; gap: 26px; text-align: center; }
  .title-slide .big { font-size: 64px; font-weight: 700; }
  .title-slide .sub { font-size: 26px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; font-size: 25px; text-align: center; }
  .box:last-child { border-color: var(--primary); box-shadow: 0 4px 15px -2px rgba(168, 85, 247, .45); }
  .arrow { font-size: 32px; color: var(--primary); }
  .chip { background: var(--card); border: 1px solid var(--primary); border-radius: 999px; padding: 10px 15px; font-size: 22px; white-space: nowrap; }
  .path .row { gap: 8px; flex-wrap: nowrap; }
  .path .arrow { font-size: 24px; }
  .path { flex-direction: column; gap: 30px; }
  .note { font-size: 26px; color: var(--muted); }
  .frame { position: relative; overflow: hidden; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 10px 25px -5px rgba(0,0,0,.5); }
  .frame img { position: absolute; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; width: 100%; }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px 20px; text-align: center; }
  .tile b { display: block; font-size: 46px; background: var(--grad-button); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tile span { font-size: 22px; color: var(--muted); }
  ul.list { list-style: none; padding: 0; display: grid; gap: 16px; width: 100%; max-width: 1000px; }
  ul.list li { display: flex; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; font-size: 26px; }
  .badge { flex: none; border: 1px solid; border-radius: 999px; padding: 3px 12px; font-size: 17px; font-weight: 600; }
  .b-qa { color: hsl(140 65% 64%); border-color: var(--ok); }
  .b-not { color: hsl(0 80% 66%); border-color: var(--bad); }
  .b-pending { color: var(--warn); border-color: var(--warn); }
  .b-dec { color: var(--primary); border-color: var(--primary); }
</style>
</head>
<body>
<div class="top"><div class="logo"><span>Cogniate</span> × Moodle <small id="stamp"></small></div><div id="right"></div></div>
<h1 id="h"></h1>
<div class="stage" id="stage"></div>
<div class="caption" id="cap"></div>
<script>
(() => {
  const S = window.SCRIPT;
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') === 'vi' ? 'vi' : 'en';
  const i = Number(q.get('i') || 0);
  const sl = S.slides[i];
  document.documentElement.lang = lang;
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const stage = document.getElementById('stage');
  const right = document.getElementById('right');
  if (lang === 'vi') right.append(el('span', 'notice', S.meta.viNotice));
  right.append(el('span', null, '   ' + (i + 1) + ' / ' + S.slides.length));
  document.getElementById('stamp').textContent = 'Source: commit ' + S.meta.commit + ', ' + S.meta.date;
  document.getElementById('cap').textContent = sl.say[lang];
  const done = () => { window.READY = true; };
  if (sl.kind === 'title') {
    document.getElementById('h').textContent = '';
    stage.classList.add('title-slide');
    stage.append(el('div', 'big', sl.title[lang]), el('div', 'sub', sl.sub[lang]));
    return done();
  }
  document.getElementById('h').textContent = sl.title[lang];
  if (sl.kind === 'flow') {
    const row = el('div', 'row');
    sl.boxes.forEach((b, k) => { if (k) row.append(el('div', 'arrow', '→')); row.append(el('div', 'box', b)); });
    stage.append(row);
    return done();
  }
  if (sl.kind === 'path') {
    stage.classList.add('path');
    const row = el('div', 'row');
    sl.chips.forEach((c, k) => { if (k) row.append(el('div', 'arrow', '→')); row.append(el('div', 'chip', c)); });
    stage.append(row, el('div', 'note', sl.note[lang]));
    return done();
  }
  if (sl.kind === 'numbers') {
    const t = el('div', 'tiles');
    sl.tiles.forEach((x) => { const d = el('div', 'tile'); d.append(el('b', null, x.big), el('span', null, x[lang])); t.append(d); });
    stage.append(t);
    return done();
  }
  if (sl.kind === 'list') {
    const ul = el('ul', 'list');
    const label = { qa: { en: 'Proven', vi: 'Đã kiểm tra' }, not: { en: 'Not proven', vi: 'Chưa chứng minh' }, pending: { en: 'Pending', vi: 'Đang chờ' }, dec: { en: 'Decide', vi: 'Quyết định' } };
    sl.items.forEach((x) => { const li = el('li'); li.append(el('span', 'badge b-' + x.st, label[x.st][lang]), el('span', null, x[lang])); ul.append(li); });
    stage.append(ul);
    return done();
  }
  if (sl.kind === 'shot') {
    const [x, y, w, h] = sl.crop;
    const scale = Math.min(1200 / w, 430 / h);
    const frame = el('div', 'frame');
    frame.style.width = Math.round(w * scale) + 'px';
    frame.style.height = Math.round(h * scale) + 'px';
    const img = new Image();
    img.onload = () => {
      img.style.width = Math.round(img.naturalWidth * scale) + 'px';
      img.style.left = Math.round(-x * scale) + 'px';
      img.style.top = Math.round(-y * scale) + 'px';
      done();
    };
    img.onerror = () => { frame.textContent = 'Missing image: ' + sl.img; done(); };
    img.src = 'file:///repo/' + sl.img;
    frame.append(img);
    stage.append(frame);
  }
})();
</script>
</body>
</html>
